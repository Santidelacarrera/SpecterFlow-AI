name: CI
on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements.txt }
      - run: pip install -r engine/requirements.txt -r sandbox/vulnerable-agent/requirements.txt
      - run: pytest -q
        working-directory: engine

  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: executor/requirements.txt }
      - run: pip install -r executor/requirements.txt
      - run: pytest -q
        working-directory: executor

  control-plane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: sf }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/sf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: control-plane/package-lock.json }
      - run: npm ci
        working-directory: control-plane
      - run: npx tsc --noEmit
        working-directory: control-plane
      - run: npm test
        working-directory: control-plane

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run build
        working-directory: frontend

  integration:
    runs-on: ubuntu-latest
    needs: [engine, executor, control-plane]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: sf }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: control-plane/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y redis-server postgresql-client
      - run: pip install -r engine/requirements.txt -r executor/requirements.txt -r sandbox/vulnerable-agent/requirements.txt
      - run: npm ci
        working-directory: control-plane
      - run: scripts/integration.sh
      - run: scripts/integration-ha.sh
        env: { DATABASE_URL: "postgres://postgres:ci@localhost:5432/sf" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: API_KEYS=x INTERNAL_TOKEN=y METRICS_TOKEN=z POSTGRES_PASSWORD=p docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - run: docker compose --profile gateway build
